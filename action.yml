name: 'Create Blog from Markdown Files'
description: 'Build a markdown blog and deploy it to GitHub Pages'
author: 't0ma5'
runs:
  using: 'node20'
  main: 'dist/index.js'
branding:
  icon: 'git-commit'
  color: 'orange'
inputs:
  token:
    description: >
      Repository-scoped GitHub Token by default. Use a PAT for cross-repo deploy.
    required: false
    default: ${{ github.token }}

  branch:
    description: 'Branch to deploy to (for example gh-pages).'
    required: false
    default: 'gh-pages'

  theme_dir:
    description: >
      Optional path to a custom theme directory (relative to the content repo,
      or absolute). If omitted, uses ./theme in the content repo when present,
      otherwise the Action's bundled theme.
    required: false
    default: ''

outputs:
  deployment-status:
    description: 'success|failed|skipped'
